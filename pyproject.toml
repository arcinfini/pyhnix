[project]
name = "pyhnix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.5.2",
    "mypy>=1.15.0",
    "python-dotenv>=1.0.1",
]




[tool.ruff]
    src = ["bot"]
    # extend-exclude = ["src/internal/check.py"]

    line-length = 80
    show-fixes = true

[tool.ruff.lint]
    select = ["ANN", "B", "C4", "D", "DTZ", "E", "F", "I", "ISC", "INT", "N", "PGH", "PIE", "Q", "RET", "RSE", "RUF", "S", "SIM", "T20", "TID", "UP", "W"]

    ignore = [
        "ANN204", "ANN401",
        "D100", "D104", "D107", "D203", "D213", "D415",
        "E731",
        "ISC001",
        "N818",
        "RUF006",
        "UP007"
    ]
    extend-select = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
order-by-type = false
case-sensitive = true
